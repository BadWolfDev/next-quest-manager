services:
  db:
    image: postgres:17-alpine
    container_name: nqm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextquest
      # Faster, deterministic initdb for local development.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - nqm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextquest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  nqm-pgdata:
